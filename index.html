<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <div class="container">
        <h1>REGISTRATION</h1>
        <form id="registrationForm">
            <div class="form-columns">
                <div class="column">
                    <div class="form-group">
                        <label for="name">NAME:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="father_name">FATHER'S NAME:</label>
                        <input type="text" id="father_name" name="father_name" required>
                    </div>
                    <div class="form-group">
                        <label for="password">PASSWORD:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="city">CITY:</label>
                        <select id="city" name="city" required>
                            <option value="">SELECT A CITY</option>
                            <option value="Jamshedpur">JAMSHEDPUR</option>
                            <option value="Karnataka">KARNATAKA</option>
                            <option value="Kerala">KERALA</option>
                        </select>
                    </div>
                 
                    <div class="form-group">
                        <label for="present_address">PRESENT ADDRESS:</label>
                        <textarea id="present_address" name="present_address"></textarea>
                    </div>
                </div>

                <div class="column">
                    <div class="form-group">
                        <label for="email">EMAIL:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="mother_name">MOTHER'S NAME:</label>
                        <input type="text" id="mother_name" name="mother_name"required>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">CONFIRM PASSWORD:</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">PHONE NUMBER:</label>
                        <input type="text" id="phone" name="phone" required>
                    </div>
                     
                    <div class="form-group">
                        <label for="permanent_address">PERMANENT ADDRESS:</label>
                        <textarea id="permanent_address" name="permanent_address" required></textarea>
                    </div>
                </div>
            </div>

            <div class="form-columns">
                <div class="column">
                    <label>COURSE:</label>
                    <div class="checkbox-group">
                        <input type="checkbox" name="course[]" value="BCA" id="bca"> <label for="bca">BCA</label>
                        <input type="checkbox" name="course[]" value="MCA" id="mca"> <label for="mca">MCA</label>
                        <input type="checkbox" name="course[]" value="BBA" id="bba"> <label for="bba">BBA</label>
                    </div>
                </div>
                <div class="column">
                    <label>GENDER:</label>
                    <div class="radio-group">
                        <input type="radio" name="gender" value="Male" id="male" required> <label for="male">Male</label>
                        <input type="radio" name="gender" value="Female" id="female"> <label for="female">Female</label>
                    </div>
                </div>
            </div>

            <input type="submit" value="Submit">
        </form>
        <span id="msg"></span>
    </div>

    <script src="form.js"></script> 
</body>

</html>
